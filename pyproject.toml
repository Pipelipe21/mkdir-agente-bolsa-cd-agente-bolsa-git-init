[project]
name = "agente-bolsa"
version = "0.1.0"
description = "Radar de señales para acciones y cripto, con evolución a paper/live trading"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
